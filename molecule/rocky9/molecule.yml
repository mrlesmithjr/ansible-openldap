---
dependency:
  name: galaxy
  enabled: true
  options:
    role-file: requirements.yml
driver:
  name: docker
ansible:
  cfg:
    defaults:
      inject_invocation: true
lint: |
  yamllint .
  ansible-lint
  flake8
platforms:
  - name: rockylinux9
    image: geerlingguy/docker-rockylinux9-ansible:latest
    privileged: true
    command: ""
    cgroupns_mode: host
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  playbooks:
    converge: ../shared/converge.yml
verifier:
  name: ansible
