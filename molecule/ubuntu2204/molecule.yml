---
dependency:
  name: galaxy
  enabled: true
  options:
    role-file: requirements.yml
    requirements-file: requirements.yml
driver:
  name: docker
ansible:
  cfg:
    defaults:
      inject_invocation: true
lint: |
  yamllint .
  ansible-lint
  flake8
platforms:
  - name: ubuntu2204
    image: mrlesmithjr/ubuntu:22.04
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
provisioner:
  name: ansible
  playbooks:
    converge: ../shared/converge.yml
verifier:
  name: ansible
